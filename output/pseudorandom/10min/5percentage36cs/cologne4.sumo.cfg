<?xml version="1.0" encoding="utf-8"?>
<configuration xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" xsi:noNamespaceSchemaLocation="http://sumo.dlr.de/xsd/sumoConfiguration.xsd">
    <input>
        <net-file value="/home/barbara/TCC/input/cologne.net.xml"/>
        <route-files value="cologne6to8-4.trips.xml"/>
        <additional-files value="cologne4.add.xml,/home/barbara/TCC/input/electric_vehicle.xml"/>
    </input>
    <time>
        <begin value="21600"/>
    </time>
    <routing>
        <routing-algorithm value="astar"/>
        <astar.landmark-distances value="/home/barbara/TCC/input/cologne_landmark_distances.txt"/>
        <device.rerouting.period value="300"/>
        <device.rerouting.adaptation-steps value="18"/>
        <device.rerouting.adaptation-interval value="10"/>
        <device.rerouting.threads value="4"/>
    </routing>
    <report>
        <verbose value="true"/>
        <log value="cologne6to8.log"/>
        <duration-log.statistics value="true"/>
        <no-step-log value="true"/>
    </report>
</configuration>
